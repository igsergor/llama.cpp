name: Build Windows CUDA 12.4 full (hermes)

on:
  workflow_dispatch:

concurrency:
  group: hermes-win-cuda
  cancel-in-progress: false

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  windows-cuda-full:
    name: windows-cuda-12.4 full
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install Cuda Toolkit 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: hermes-win-cuda-12.4-full

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON %CMAKE_ARGS%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack CUDA runtime into bundle
        shell: pwsh
        run: |
          $dst = '.\build\bin\Release\'
          robocopy "$env:CUDA_PATH\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "$env:CUDA_PATH\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "$env:CUDA_PATH\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a hermes-win-cuda-12.4-full.zip .\build\bin\Release\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: hermes-win-cuda-12.4-full
          path: hermes-win-cuda-12.4-full.zip
